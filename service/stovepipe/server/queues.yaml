defaults:
  stages:
    process:
      maxConcurrent: 1
      gateWaitDelay: 5s
    buildSignal:
      acceptedPollDelay: 5s
      runningPollDelay: 2s
    buildAnalysis:
      pollDelay: 2m
    issueTrack:
      refreshDelay: 30s
      recoveryWaitDelay: 30s
queues:
  - name: monorepo/main
  - name: monorepo/release
  - name: monorepo/slow?buildrunner-fake=build-slow
